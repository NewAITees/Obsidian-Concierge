[project]
name = "obsidian-concierge"
version = "0.1.0"
description = "LLMベースのObsidianアシスタント"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "chromadb>=0.4.22",
    "langchain>=0.1.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    "aiofiles>=23.2.1",
    "watchfiles>=0.21.0",
    "markdown>=3.5.2",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.1",
    "bandit>=1.8.3",
    "httpx>=0.28.1",
    "rich>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "mypy>=1.8.0",
    "ruff>=0.11.0",
    "bandit>=1.8.3",
    "safety>=3.0.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", ".ruff_cache", ".venv", ".vscode"]

[tool.ruff.lint]
preview = true
select = [
    "ANN",  # type annotation
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "RUF",  # ruff specific rules
    "W",    # pycodestyle warnings
]
ignore = [
    "F401",  # unused import
    "F841",  # unused variable
]
unfixable = ["F401", "F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_optional = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=obsidian_concierge",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["obsidian_concierge"]
omit = ["tests/*"]